# Netlify build konfiguracija za NEXUS GG (Vite SPA)
# Frontend se gradi i servira statički iz `dist/`.
# NAPOMENA: Express backend (server.ts, /api/*) NE radi na Netlify statičkom hostu.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: direktan pristup / osvežavanje na rutama kao /forum ili /admin
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
